<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <!-- CSS externo -->

<body>
    <header>
        <div class="container">
            <div class="logo-section">
                <img src="imagens/logo.jpg.jfif" alt="Logo Telúrio Company" class="logo">
                <h1>Telúrio Company</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html#eventos">Eventos</a></li>
                    <li><a href="index.html#sobre">Sobre</a></li>
                    <li><a href="cadastro.html">Cadastre Eventos</a></li>
                    <li><a href="admin.html">Área do Adm</a></li>
                    <li><a href="Login/Register.html">Login/Register</a></li>
                </ul>
            </nav>
            <button class="hamburger" id="hamburger-button" aria-label="Abrir menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </header>
    <div class="cadastro-center">
        <div class="form-container">
            <h2>Cadastrar Novo Evento</h2>
            <form>
                <div class="form-group">
                    <label for="nome">Nome do Evento</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="data">Data</label>
                    <input type="date" id="data" name="data" required>
                </div>
                <div class="form-group">
                    <label for="local">Local</label>
                    <input type="text" id="local" name="local" required>
                </div>
                <div class="form-group">
                    <label for="imagem">Imagem/Banner do Evento</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="maps">Localização (Google Maps)</label>
                    <input type="text" id="maps" name="maps" placeholder="Cole o link do Google Maps">
                </div>
                <button type="submit" class="btn-cadastrar">Cadastrar Evento</button>
            </form>
        </div>
    </div>
